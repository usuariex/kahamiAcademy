<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="csscontacto/styles.css">
</head>
<body>

      <section class="contact-section" id="contacto">

  <div class="contact-container">

    <div class="contact-text">

      <h2>¿Listo para comenzar?</h2>

      <p>Si tienes preguntas o quieres más información sobre nuestros cursos, déjanos tus datos.</p>

      <p>Te contactamos sin compromiso.</p>

    </div>



    <div class="contact-form">

      <h3>Escríbenos</h3>

      <p>Habla con nosotros y empieza a formarte hoy</p>



      <form action="#" method="POST">

        <div class="form-group">

          <input type="text" placeholder="Nombres" required>

        </div>

        <div class="form-group">

          <input type="email" placeholder="Correo Electrónico" required>

        </div>

        <div class="form-group">

          <input type="tel" placeholder="Teléfono" required>

        </div>

        <button type="submit">ENVIAR</button>

      </form>

    </div>

  </div>

</section>


    
</body>
</html>
